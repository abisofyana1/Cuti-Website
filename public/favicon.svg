<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base Icon -->
  <rect x="4" y="6" width="40" height="36" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  
  <!-- Calendar Header Strip -->
  <path d="M4 14 Q4 6 12 6 L36 6 Q44 6 44 14 L44 16 L4 16 Z" fill="#1E40AF"/>

  <!-- Calendar Rings / Hooks -->
  <rect x="12" y="3" width="4" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="32" y="3" width="4" height="6" rx="2" fill="#FFFFFF"/>

  <!-- Calendar Grid Dots (Symbolizing Days) -->
  <circle cx="14" cy="22" r="1.75" fill="#BFDBFE"/>
  <circle cx="20" cy="22" r="1.75" fill="#BFDBFE"/>
  <circle cx="26" cy="22" r="1.75" fill="#BFDBFE"/>
  <circle cx="32" cy="22" r="1.75" fill="#BFDBFE"/>

  <circle cx="14" cy="28" r="1.75" fill="#BFDBFE"/>
  <circle cx="20" cy="28" r="1.75" fill="#BFDBFE"/>
  <circle cx="14" cy="34" r="1.75" fill="#BFDBFE"/>

  <!-- Green Leave / Approval Badge Circle -->
  <circle cx="31" cy="31" r="9" fill="#10B981" filter="url(#shadow)"/>
  
  <!-- White Checkmark (Approved Cuti) -->
  <path d="M26.5 31 L29.5 34 L35.5 28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
